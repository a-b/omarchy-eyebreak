name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same validator `omarchy plugin validate` runs, pinned to the Omarchy release it ships in.
      - name: Fetch Omarchy plugin validator (v4.5.0-rc1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: 03ff1eff3812933f7088484533784d2f63eaf19a
          path: .omarchy
          sparse-checkout: bin/omarchy-plugin-validate
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Validate manifest
        run: bash .omarchy/bin/omarchy-plugin-validate .

      - name: Plugin ID is permanent
        run: test "$(jq -r .id manifest.json)" = a-b.eyebreak

      - name: Model tests
        run: node --test tests/model.test.js
